name: Windows
# Tests the Windows port, packages it (per-user installer + portable zip, x64 and ARM64), screenshots the real
# Windows build with sample data, and publishes a pre-release for windows-v* tags. Windows releases never become
# "latest": the website, README and Homebrew rely on releases/latest being the Mac DMG.
on:
  push:
    branches: [main]
    tags: ["windows-v*"]
    paths: ["Windows/**", "Tests/vectors/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["Windows/**", "Tests/vectors/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the release job without publishing (prints the asset names)"
        type: boolean
        default: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  VPK_VERSION: 1.2.161 # keep in step with the Velopack package in Weekmark.App.csproj
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - run: dotnet test Windows/Weekmark.sln -c Release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renders-${{ matrix.os }}
          path: Windows/tests/Weekmark.App.Tests/bin/Release/net10.0/renders/
          if-no-files-found: ignore

  package:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - id: version
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/windows-v*') { $env:GITHUB_REF_NAME -replace '^windows-v', '' } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version $v"
      - name: Publish
        run: dotnet publish Windows/src/Weekmark.App -c Release -r ${{ matrix.rid }} --self-contained -p:Version=${{ steps.version.outputs.version }} -o publish

      # Signing: switched on by setting the repository variable SIGNPATH_ENABLED to true once the SignPath Foundation
      # approves the project (needs secret SIGNPATH_API_TOKEN and variable SIGNPATH_ORGANIZATION_ID). Skipped until then.
      - id: unsigned
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.rid }}
          path: |
            publish/Weekmark.exe
            publish/Weekmark*.dll
      - if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: weekmark
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish # signed files replace the unsigned ones before packing

      - name: Install vpk
        run: dotnet tool install -g vpk --version $env:VPK_VERSION
      - name: Pack
        run: vpk pack --packId Weekmark --packVersion ${{ steps.version.outputs.version }} --packDir publish --mainExe Weekmark.exe --runtime ${{ matrix.rid }} --channel ${{ matrix.rid }} --outputDir releases
      - run: Get-ChildItem releases
      - uses: actions/upload-artifact@v7
        with:
          name: weekmark-${{ matrix.rid }}
          path: |
            releases/*-Setup.exe
            releases/*-Portable.zip
          if-no-files-found: error

  screenshot:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: weekmark-win-x64, path: pkg }
      - name: Screenshot and measure
        run: |
          Expand-Archive (Get-ChildItem pkg/*-Portable.zip).FullName app
          $exe = (Get-ChildItem app -Recurse -Filter Weekmark.exe | Where-Object { $_.Directory.Name -eq 'current' } | Select-Object -First 1).FullName
          if (-not $exe) { Get-ChildItem app -Recurse | Select-Object FullName; throw 'Weekmark.exe not found in the portable zip' }
          $png = Join-Path $pwd 'widget.png'
          $p = Start-Process $exe -ArgumentList '--demo-data', '--screenshot', "`"$png`"", '--exit-after', '15' `
            -RedirectStandardOutput out.txt -RedirectStandardError err.txt -Wait -PassThru
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0) { throw "Weekmark exited with $($p.ExitCode)" }
          if (-not (Test-Path $png)) { throw 'widget.png was not written' }
          $m = Select-String -Path out.txt -Pattern 'working_set_mb=(\d+)'
          if (-not $m) { throw 'no working_set_mb in the output' }
          $mb = [int]$m.Matches[0].Groups[1].Value
          if ($mb -gt 100) { "::warning::Working set is $mb MB, above the 100 MB target" }
      - uses: actions/upload-artifact@v7
        with: { name: widget.png, path: widget.png, if-no-files-found: error }

  release:
    needs: [test, package, screenshot]
    if: startsWith(github.ref, 'refs/tags/windows-v') || inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: weekmark-win-*, path: pkg }
      - name: Name the assets
        run: |
          mkdir assets
          for arch in x64 arm64; do
            cp pkg/weekmark-win-$arch/*-Setup.exe "assets/Weekmark-Windows-$VERSION-$arch-Setup.exe"
            cp pkg/weekmark-win-$arch/*-Portable.zip "assets/Weekmark-Windows-$VERSION-$arch-Portable.zip"
          done
          ls -1 assets
      - name: Dry run
        if: inputs.dry_run
        run: |
          echo "Dry run: would create pre-release ${GITHUB_REF_NAME} titled \"Weekmark for Windows $VERSION\" (not latest) with:"
          ls -1 assets
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/windows-v') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --title "Weekmark for Windows $VERSION" \
            --notes-file "Windows/release-notes/$VERSION.md" --prerelease --latest=false
