# Generate the Xcode project:  cd Mobile && xcodegen
name: WeekmarkMobile
options:
  bundleIdPrefix: com.rockykusuma
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    DEVELOPMENT_TEAM: Y87BZN47C5
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Weekmark:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - Shared
      - path: ../Sources/CWCore
        group: CWCore
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Weekmark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/App/Weekmark.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rockykusuma.weekmark]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.rockykusuma.weekmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockykusuma.weekmark.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: WeekmarkWidgets
      - target: WeekmarkWatch

  WeekmarkWidgets:
    type: app-extension
    platform: iOS
    sources:
      - iOS/Widgets
      - Shared
      - path: ../Sources/CWCore
        group: CWCore
    info:
      path: iOS/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Weekmark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rockykusuma.weekmark]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.rockykusuma.weekmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockykusuma.weekmark.mobile.widgets
        TARGETED_DEVICE_FAMILY: "1,2"

  WeekmarkWatch:
    type: application
    platform: watchOS
    sources:
      - watchOS/App
      - Shared
      - path: ../Sources/CWCore
        group: CWCore
    info:
      path: watchOS/App/Info.plist
      properties:
        CFBundleDisplayName: Weekmark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rockykusuma.weekmark.mobile
    entitlements:
      path: watchOS/App/WatchApp.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rockykusuma.weekmark]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.rockykusuma.weekmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockykusuma.weekmark.mobile.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    dependencies:
      - target: WeekmarkWatchWidgets

  WeekmarkWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - watchOS/Widgets
      - Shared
      - path: ../Sources/CWCore
        group: CWCore
    info:
      path: watchOS/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Weekmark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: watchOS/Widgets/WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rockykusuma.weekmark]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.rockykusuma.weekmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockykusuma.weekmark.mobile.watchkitapp.widgets
        SKIP_INSTALL: YES

schemes:
  Weekmark:
    build:
      targets:
        Weekmark: all
    run:
      config: Debug
